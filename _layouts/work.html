<!DOCTYPE html>
<html lang=en id="appRoot">
	<script async src="https://www.googletagmanager.com/gtag/js?id=UA-63847002-2"></script>
	<script>
		window.dataLayer = window.dataLayer || [];
		function gtag(){dataLayer.push(arguments);}
		gtag('js', new Date());

		gtag('config', 'UA-63847002-2');
	</script>
	<meta charset="utf-8"/>
	<title>{{ site.name }}{% if page.title %} - {{ page.title }}{% endif %}</title>
	<meta name="viewport" content="width=device-width, initial-scale=1"/>

	<title>Matthew Paul - Software Designer</title>
	<meta name="description" content="Software Designer and Design Engineer with 12+ years of experience, specializing in designer, developer, and collaborative workflow tools.">

	<meta property="og:type" content="website">
	<meta property="og:title" content="{{ site.name }} - {{ page.title }}"/>
	<meta property="og:description" content="{{ site.description | strip_html }}"/>
	<meta property="og:image" content="https://matthewcpaul.com/images/og/og-image.jpg"/>
	<meta property="og:url" content="https://matthewcpaul.com"/>

	<meta name="twitter:card" content="summary_large_image">
	<meta name="twitter:title" content="Matthew Paul - Software Designer">
	<meta name="twitter:description" content="Software Designer and Design Engineer with 12+ years of experience, specializing in designer, developer, and collaborative workflow tools.">
	<meta name="twitter:image" content="https://matthewcpaul.com/images/og/twitter-image.jpg">
	<meta name="robots" content="max-image-preview:large">

	<link rel="canonical" href="https://matthewcpaul.com/">
	<link rel="stylesheet" href="/assets/css/style.css">
	<link rel="shortcut icon" href="{{ baseurl }}/images/favicon/favicon-matthew-paul.png"/>

	<body>
		<div class="c-wrap__pad" tabindex="-1">
			<div class="c-wrap">
				<header>
					{% include header.html %}
				</header>
				<main class="c-main">
					<article>
						<section>
							<h1 class="heading-max-width">{{ page.heading }}</h1>
							<p class="description-max-width">{{ page.description }}</p>
						</section>
						<hr>
						{{ content }}
					</article>
				</main>
				{% include footer.html %}
			</div>
		</div>
	</body>
</html>
