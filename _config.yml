# Site Config
name: "Matthew Paul - Software Designer"
description: Software Designer and Design Engineer with 12+ years of experience, specializing in designer, developer, and collaborative workflow tools.
url: https://matthewcpaul.com

# Build Settings
markdown: kramdown
highlighter: true
permalink: pretty

# In/ Excludes
include: [".htaccess"]
exclude: ["vendor", "node_modules", "gulpfile.js", "Gemfile", "Gemfile.lock", ".jekyll-cache", ".jekyll-metadata", "commit-hook.sh", "package.json", "local_config.yml", "README.md"]

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Assets
assets:
  digest: true
  cache: false
  sources:
    - "_site/assets"

# Read and Output Collections
collections:
  talks:
    output: false
    permalink: /org/:path/
  work:
    output: true
    permalink: /work/:path/
  blog:
    output: true
    permalink: /blog/:path/
